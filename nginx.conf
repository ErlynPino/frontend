server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Angular usa client-side routing: cualquier ruta desconocida
    # devuelve index.html para que el router lo maneje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Activos con hash (Angular outputHashing=all) → caché inmutable 1 año.
    # El nombre del archivo cambia con cada build, así que nunca habrá stale cache.
    location ~* \.(js|css|woff2?|ttf|eot|ico|webp|png|jpg|jpeg|gif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip para reducir transferencia de bytes
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml;

    # Cabeceras de seguridad básicas
    add_header X-Frame-Options      "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header Referrer-Policy      "strict-origin-when-cross-origin" always;
}
