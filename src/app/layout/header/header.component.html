<header class="topbar">
  <!-- Left: Breadcrumb -->
  <div class="topbar__left">
    <div class="topbar__breadcrumb">
      <span class="pi pi-home topbar__breadcrumb-icon"></span>
      <span class="topbar__breadcrumb-sep">›</span>
      <span class="topbar__breadcrumb-page">Panel de administración</span>
    </div>
  </div>

  <!-- Right: Status + User -->
  <div class="topbar__right">
    <div class="topbar__status">
      @switch (apiStatus()) {
        @case ('ok') {
          <span class="topbar__status-dot topbar__status-dot--ok"></span>
          <span class="topbar__status-label">API operativa</span>
        }
        @case ('error') {
          <span class="topbar__status-dot topbar__status-dot--error"></span>
          <span class="topbar__status-label">API no disponible</span>
        }
        @default {
          <span class="topbar__status-dot topbar__status-dot--checking"></span>
          <span class="topbar__status-label">Verificando...</span>
        }
      }
    </div>

    <div class="topbar__divider"></div>

    <div class="topbar__user">
      <div class="topbar__user-avatar">
        <span class="pi pi-user"></span>
      </div>
      <div class="topbar__user-info">
        <span class="topbar__user-name">Administrador</span>
        <span class="topbar__user-role">Super Admin</span>
      </div>
    </div>
  </div>
</header>
