<aside class="sidebar">
  <!-- LATAM Brand -->
  <div class="sidebar__brand">
    <div class="sidebar__brand-logo">
      <span class="pi pi-send sidebar__brand-icon"></span>
    </div>
    <div class="sidebar__brand-text">
      <span class="sidebar__brand-name">LATAM</span>
      <span class="sidebar__brand-sub">Admin Portal</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar__nav" role="navigation" aria-label="Menú principal">
    @for (section of navSections; track section.label) {
      <div class="sidebar__section">
        <span class="sidebar__section-label">{{ section.label }}</span>
        @for (item of section.items; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="sidebar__item--active"
            [routerLinkActiveOptions]="{ exact: false }"
            class="sidebar__item"
            [attr.aria-label]="item.label"
          >
            <span class="sidebar__item-icon pi {{ item.icon }}"></span>
            <span class="sidebar__item-label">{{ item.label }}</span>
          </a>
        }
      </div>
    }
  </nav>

  <!-- Footer -->
  <div class="sidebar__footer">
    <div class="sidebar__footer-status">
      <span class="sidebar__footer-dot"></span>
      <span class="sidebar__footer-text">User Management API v1.0</span>
    </div>
  </div>
</aside>
