<p-dialog
  [header]="header()"
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '30rem' }"
  [breakpoints]="{ '576px': '92vw' }"
>
  <div class="confirm-dialog__body">
    <span class="confirm-dialog__icon {{ icon() }}"></span>
    <p class="confirm-dialog__message" [innerHTML]="message()"></p>
  </div>

  <ng-template #footer>
    <p-button
      [label]="rejectLabel()"
      severity="secondary"
      [outlined]="true"
      (onClick)="onReject()"
    />
    <p-button
      [label]="confirmLabel()"
      [severity]="confirmSeverity()"
      (onClick)="onConfirm()"
    />
  </ng-template>
</p-dialog>
